name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    name: Tag engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p musictag-core --no-fail-fast

  build-windows:
    name: Portable Windows exe
    needs: test-core
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      APP_VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npx tauri build --no-bundle
      - name: Collect exe
        shell: bash
        run: |
          mkdir dist
          cp target/release/musictag.exe "dist/MusicTag-v${APP_VERSION}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicTag-v${{ env.APP_VERSION }}
          path: dist/MusicTag-v${{ env.APP_VERSION }}.exe
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "dist/MusicTag-v${APP_VERSION}.exe" \
            --title "MusicTag v${APP_VERSION}" \
            --notes "Portable Windows 11 build ${APP_VERSION} (commit ${GITHUB_SHA::7}). Download the .exe and run it - no install needed."
